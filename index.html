<style>
/* Layout: a writing desk. Left column holds the writing and page options, right column holds the live sheet and the download button. Single look: dark walnut desk, brass accent, paper is drawn on a canvas. */
:root {

  --line: #5b4533;
  --text: #f2e6cc;
  --muted: #bda989;
  --brass: #e3a93f;
  --brass-ink: #261a0f;
  --danger: #f08c6b;
  --display: "IM Fell English", Georgia, "Times New Roman", serif;
  --label: "Special Elite", "Courier New", monospace;
  --body: Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,.05) 0 2px, rgba(255,255,255,.015) 2px 5px),
    radial-gradient(120% 90% at 50% 0%, var(--desk-2), var(--desk));
  background-color: var(--desk);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 28px 56px;
}
.wrap { max-width: 1120px; margin-inline: auto; }
header { text-align: center; margin-bottom: 28px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .02em; margin: 0; text-wrap: balance; }
.tag { font-family: var(--label); color: var(--muted); font-size: .95rem; margin: 6px 0 0; letter-spacing: .04em; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
label, .lbl { font-family: var(--label); font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input[type=text], textarea {
  width: 100%; background: #2a1e15; color: var(--text); border: 1px solid var(--line); border-radius: 4px;
  padding: 10px 12px; font: inherit; min-width: 0;
}
textarea { min-height: 220px; resize: vertical; line-height: 1.55; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.count { font-family: var(--label); font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.count.full { color: var(--danger); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-family: var(--label); font-size: .85rem; color: var(--text); background: #2a1e15; border: 1px solid var(--line);
  border-radius: 4px; padding: 8px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; min-width: 0;
}
.chip[aria-pressed=true] { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); background: #3d2c1b; }
.pat { width: 22px; height: 26px; flex: none; background-color: #e8d49a; border-radius: 2px; border: 1px solid #00000040; }
.pat.ruled { background-image: linear-gradient(#7a8fb066 1px, transparent 1px); background-size: 100% 6px; }
.pat.wide { background-image: linear-gradient(#7a8fb099 1px, transparent 1px); background-size: 100% 9px; }
.pat.grid { background-image: linear-gradient(#7a8fb077 1px, transparent 1px), linear-gradient(90deg, #7a8fb077 1px, transparent 1px); background-size: 6px 6px; }
.pat.dots { background-image: radial-gradient(#5a6a8aaa 1px, transparent 1.2px); background-size: 6px 6px; }
.pat.plain { }
.pat.cornell { background-image: linear-gradient(90deg, transparent 8px, #b0554a99 8px 9px, transparent 9px), linear-gradient(#7a8fb066 1px, transparent 1px); background-size: 100% 100%, 100% 6px; }
.pat.todo { background-image: linear-gradient(#7a8fb066 1px, transparent 1px), radial-gradient(#00000000 2px, #3a2a1a 2.2px 3px, transparent 3.2px); background-size: 100% 6px, 100% 6px; }
.pat.letter { box-shadow: inset 0 0 0 3px #e8d49a, inset 0 0 0 4px #7a5a3a; }
.pat.legal { background-color: #f0dd7a; background-image: linear-gradient(90deg, transparent 5px, #c0453a 5px 6px, transparent 6px 7px, #c0453a 7px 8px, transparent 8px), linear-gradient(#6f86b177 1px, transparent 1px); background-size: 100% 100%, 100% 6px; }
.pat.scrap { box-shadow: inset 0 0 0 3px #e8d49a, inset 0 0 0 4px #7a5a3a; background-image: radial-gradient(#5a6a8a88 1px, transparent 1.2px); background-size: 6px 6px; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed=true] { border-color: var(--brass); box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--brass); }
.fontchip { font-size: 1.25rem; padding: 4px 12px; line-height: 1.4; }

.opt input { accent-color: var(--brass); width: 18px; height: 18px; }

.actions { display: flex; flex-direction: column; gap: 10px; max-width: 560px; width: 100%; margin-inline: auto; }
.note { font-family: var(--label); font-size: .85rem; color: var(--muted); min-height: 1.4em; text-align: center; margin: 0; }
.note.err { color: var(--danger); }

body { overflow-x: clip; }
.paperbox { position: relative; }
canvas#sheet { position: relative; z-index: 2; will-change: transform; }
.stack { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

<div class="wrap">
  <header>
    <h1>Torn Pages</h1>
    <p class="tag">Write it down. Tear it out. Keep it.</p>
  </header>

  <div class="grid">
    <section class="card" aria-label="Write your page">
      <div class="field">
        <label for="date">Date</label>
        <input type="text" id="date" maxlength="60" autocomplete="off">
      </div>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" maxlength="60" placeholder="Dear Diary," autocomplete="off">
      </div>
      <div class="field">
        <label for="body">Your entry</label>
        <textarea id="body" placeholder="What happened today? Write anything you want to remember."></textarea>
        <div class="count" id="count"><span id="lines">0 lines used</span><span id="left"></span></div>
        <div class="row"><button type="button" class="chip" id="clear">Clear page</button></div>
      </div>

      <div class="field">
        <span class="lbl">Page style</span>
        <div class="row" id="styles"></div>
      </div>
      <div class="field">
        <span class="lbl">Paper</span>
        <div class="row" id="papers"></div>
      </div>
      <div class="field">
        <span class="lbl">Ink</span>
        <div class="row" id="inks"></div>
      </div>
      <div class="field">
        <span class="lbl">Handwriting</span>
        <div class="row" id="fonts"></div>
      </div>
      <div class="field">
        <span class="lbl">Torn edge</span>
        <div class="row" id="edges"></div>
      </div>
      <div class="field">
        <span class="lbl">Extras</span>
        <div class="row">
          <label class="opt"><input type="checkbox" id="x-stain"> Coffee stain</label>
          <label class="opt"><input type="checkbox" id="x-tape"> Tape</label>
          <label class="opt"><input type="checkbox" id="x-fold" checked> Fold crease</label>
          <label class="opt"><input type="checkbox" id="x-age" checked> Age spots</label>
        </div>
      </div>
    </section>

    <section class="stage" aria-label="Preview">
      <div class="paperbox"><canvas id="sheet" width="940" height="1240" aria-label="Preview of your torn diary page"></canvas></div>
      <div class="actions">
        <button class="btn" id="dl" type="button">Download this page</button>
        <button class="btn ghost" id="retear" type="button">Tear it differently</button>
        <p class="note" id="note" role="status"></p>
      </div>
    </section>
  </div>
  <footer>Your writing stays in your browser. Nothing is uploaded.</footer>
</div>
